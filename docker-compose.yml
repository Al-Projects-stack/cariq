version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cariq:cariq@db:5432/cariq
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX:-cariq-kb}
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - IP_HASH_SALT=${IP_HASH_SALT:-change-me}
      - FAILURE_SCORE_THRESHOLD=${FAILURE_SCORE_THRESHOLD:-0.45}
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cariq
      - POSTGRES_PASSWORD=cariq
      - POSTGRES_DB=cariq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cariq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
