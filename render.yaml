services:
  - type: web
    name: cariq-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from fastembed import TextEmbedding; model = TextEmbedding('BAAI/bge-small-en-v1.5'); list(model.embed(['warmup']))"
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: cariq-kb
      - key: DATABASE_URL
        value: sqlite:///./cariq.db
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: FAILURE_SCORE_THRESHOLD
        value: 0.45
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Daily LLM spend caps (defaults in app/config.py)
      - key: TOTAL_DAILY_QUERY_LIMIT
        value: 600

  - type: web
    name: cariq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA fallback: serve index.html for all client-side routes (/admin/*, /model/*, ...)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      # Never put secrets in VITE_* vars: they are baked into the public JS bundle
